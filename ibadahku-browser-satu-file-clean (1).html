<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a9c879"><title>Ibadahku 🌷</title><style>
:root{--green:#a7c875;--light:#eff9dc;--ink:#34472e;--pink:#ffecf0;--line:#d9e6c6}*{box-sizing:border-box}body{margin:0;background:#f7f9f1;color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:680px;margin:auto;padding:16px 15px 95px}header{background:linear-gradient(120deg,#c6e99c,#f5f9e5);border-radius:22px;padding:25px 20px;position:relative;overflow:hidden}header:after{content:''}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;margin:0 0 14px}.muted{color:#6b7961;font-size:13px}.card{background:white;border:1px solid #e8eedf;border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 3px 12px #57703c0a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:white;border-radius:16px;padding:15px 7px;text-align:center}.stat b{display:block;font-size:24px;color:#6c9440}.stat span{font-size:11px;color:#718166}.progress{height:13px;border-radius:20px;background:#edf2e7;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#9ec86e,#f3b6c9);transition:width .3s}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:var(--light);color:var(--ink);padding:10px 13px}button.primary{background:#a6ca78;font-weight:700}button:active{transform:scale(.98)}input,select{border:1px solid #d9e6c6;border-radius:12px;padding:12px;width:100%;background:white;color:var(--ink)}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3;padding-bottom:env(safe-area-inset-bottom)}.tabs button{background:none;border-radius:0;flex:1;max-width:160px;padding:12px 2px;font-size:12px}.tabs button.active{color:#548022;font-weight:800;background:#f0f8e6}.habit{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eff1e9}.habit:last-child{border:0}.check{width:31px;height:31px;flex:none;border:2px solid #b9d992;border-radius:10px;background:#fff;font-size:20px;padding:0;display:grid;place-items:center}.check.done{background:#a9ce7a;color:white}.habit .label{flex:1;min-width:0}.habit .label strong{display:block;font-size:14px}.habit small{color:#78846d}.info{background:#f8edf2;border-radius:50%;width:30px;height:30px;padding:0}.chip{display:inline-block;padding:6px 10px;background:#edf5df;border-radius:30px;font-size:12px;margin:3px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.day{padding:9px 0;border-radius:9px;font-size:12px;background:#f3f7eb}.day.selected{background:#9bc56a;font-weight:800}.day.today{outline:2px solid #f0abc4}.day.other{opacity:.35}.bar{background:#eaf2df;height:95px;display:flex;align-items:end;border-radius:8px;overflow:hidden}.bar>div{background:#a8ca79;width:100%;min-height:2px}.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;align-items:end;text-align:center}.chart small{font-size:10px}.modal{position:fixed;inset:0;background:#26351cb3;display:grid;place-items:center;padding:20px;z-index:5}.modal .panel{max-width:460px;width:100%;max-height:85vh;overflow:auto;background:white;border-radius:22px;padding:23px}.hidden{display:none!important}.quote{border-left:4px solid #b5d88b;padding:10px 13px;background:#f4f9ed;line-height:1.65}.reward{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#e5f4d0;border:1px solid #98c96b;padding:14px 20px;border-radius:18px;box-shadow:0 8px 30px #0002;z-index:8;text-align:center;min-width:230px}.empty{padding:20px;text-align:center;color:#839079}.sectiontitle{font-weight:800;color:#648c42;margin:20px 0 6px}textarea{width:100%;min-height:80px;border:1px solid #d9e6c6;border-radius:12px;padding:10px}
.prayer-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:14px}.prayer-btn{padding:12px 3px;display:flex;flex-direction:column;align-items:center;gap:6px;background:#f5f8ef;border:1px solid #dfe9d1;min-width:0}.prayer-btn strong{font-size:11px}.prayer-btn span:last-child{font-size:10px}.prayer-emoji{font-size:23px}.prayer-done{background:#cce9a6;border-color:#85b84f}.prayer-card .muted{line-height:1.5}@media(max-width:390px){.prayer-grid{gap:4px}.prayer-btn{padding:10px 1px}.prayer-btn strong{font-size:10px}}</style></head><body><div id="root" class="app"></div><nav class="tabs" id="tabs"></nav><div class="modal hidden" id="modal"><div class="panel" id="modalContent"></div></div><div id="toast" class="reward hidden"></div><script>'use strict';
const B={consistent:['Amalan yang paling dicintai Allah adalah yang dilakukan terus-menerus meskipun sedikit.','HR. Bukhari no. 6464 dan Muslim no. 783'],quran:['Sebaik-baik kalian adalah yang mempelajari Al-Qur’an dan mengajarkannya.','HR. Bukhari no. 5027'],night:['Rabb kita turun ke langit dunia pada sepertiga malam terakhir dan mengabulkan doa hamba-Nya.','HR. Bukhari no. 1145 dan Muslim no. 758'],charity:['Setiap persendian manusia wajib bersedekah setiap hari ketika matahari terbit.','HR. Bukhari no. 2989 dan Muslim no. 1009'],dhikr:['Siapa yang bertasbih 33 kali, bertahmid 33 kali dan bertakbir 33 kali seusai salat, lalu melengkapi seratus dengan tahlil, diampuni kesalahannya walaupun sebanyak buih lautan.','HR. Muslim no. 597'],monday:['Ketika ditanya tentang puasa hari Senin, Nabi ﷺ menjawab: pada hari itu aku dilahirkan dan wahyu diturunkan kepadaku.','HR. Muslim no. 1162'],intention:['Sesungguhnya setiap amalan tergantung pada niatnya.','HR. Bukhari no. 1 dan Muslim no. 1907']};
const initial=[['Sholat Tahajud',24,'night','Malam'],['Sholat Qobliyah Subuh',24,'consistent','Pagi'],['Ngaji 1 lembar (pagi)',24,'quran','Pagi'],['Sedekah Subuh',30,'charity','Pagi'],['Dzikir Pagi',30,'dhikr','Pagi'],['Sholat Dhuha',24,'consistent','Pagi'],['Membaca Ar-Rahman',30,'quran','Pagi'],['Membaca Al-Waqiah',30,'quran','Pagi'],['Membaca Ayat Seribu Dinar',30,'quran','Pagi'],['Dzikir Nabi Musa',30,'intention','Pagi'],['Sholawat',30,'consistent','Pagi'],['Istigfar, Tasbih, Tahmid, Takbir 100x',30,'dhikr','Pagi'],['Sholat Qobliyah Dzuhur',24,'consistent','Siang'],['Sholat Ba’diyah Dzuhur',24,'consistent','Siang'],['Ngaji 1 lembar (siang)',24,'quran','Siang'],['Dzikir Petang',30,'dhikr','Petang'],['Sholat Ba’diyah Magrib',24,'consistent','Petang'],['Ngaji 1 lembar (petang)',24,'quran','Petang'],['Sholat Ba’diyah Isya',24,'consistent','Malam'],['Membaca Al-Mulk',24,'quran','Malam'],['Ngaji 1 lembar (malam)',24,'quran','Malam'],['Membaca Al-Kahfi',4,'quran','Pekan'],['Puasa Senin/Kamis',8,'monday','Pekan']].map((a,i)=>({id:'h'+i,name:a[0],goal:a[1],hadith:a[2],group:a[3]}));
const key='ibadahku.v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch{state={}};state.habits??=initial;state.logs??={};state.name??='';state.customHadith??={};state.prayers??={};let page='today',selected=localDate(),month=selected.slice(0,7);const root=document.getElementById('root'),modal=document.getElementById('modal');const save=()=>localStorage.setItem(key,JSON.stringify(state));function localDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function checked(id,date=selected){return !!state.logs[date]?.includes(id)}function completed(date=selected){return state.habits.filter(h=>checked(h.id,date)).length}function pct(date=selected){return state.habits.length?Math.round(completed(date)/state.habits.length*100):0}function points(){return Object.values(state.logs).reduce((a,ids)=>a+ids.length*10,0)+Object.values(state.prayers||{}).reduce((a,ids)=>a+ids.length*10,0)}function level(){return Math.floor(points()/200)+1}function closeModal(){modal.classList.add('hidden')}function showModal(html){document.getElementById('modalContent').innerHTML=html;modal.classList.remove('hidden')}function toast(message){let el=document.getElementById('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>el.classList.add('hidden'),2400)}function toggle(id){state.logs[selected]??=[];let list=state.logs[selected],i=list.indexOf(id);if(i>=0){list.splice(i,1);toast('Checklist dibatalkan')}else{list.push(id);toast('🌷 MasyaAllah! +10 poin • Terus istiqamah');if(list.length===state.habits.length)toast('🏆 Semua target hari ini selesai!')}save();render()}
const obligatory=[['subuh','Subuh','🌅'],['dzuhur','Dzuhur','☀️'],['ashar','Ashar','🌤️'],['maghrib','Maghrib','🌇'],['isya','Isya','🌙']];
function prayerDone(id,date=selected){return (state.prayers?.[date]||[]).includes(id)}
function prayerCount(date=selected){return obligatory.filter(([id])=>prayerDone(id,date)).length}
function togglePrayer(id){if(!obligatory.some(([x])=>x===id))return;state.prayers??={};state.prayers[selected]??=[];let a=state.prayers[selected],i=a.indexOf(id);if(i>=0){a.splice(i,1);toast('Catatan shalat dibatalkan')}else{a.push(id);toast('🌷 Alhamdulillah! Shalat tercatat • +10 ⭐')}save();render()}
function prayerCard(){let count=prayerCount();return `<div class="card prayer-card"><div class="row between"><h2>🕌 Counter shalat wajib</h2><span class="chip">${count}/5 selesai</span></div><div class="progress"><div style="width:${count*20}%"></div></div><p class="muted">Catat sekali untuk setiap shalat pada tanggal yang dipilih. Ketuk lagi untuk membatalkan.</p><div class="prayer-grid">${obligatory.map(([id,name,emoji])=>`<button class="prayer-btn ${prayerDone(id)?'prayer-done':''}" aria-pressed="${prayerDone(id)}" onclick="togglePrayer('${id}')"><span class="prayer-emoji">${emoji}</span><strong>${name}</strong><span>${prayerDone(id)?'✓ Selesai':'+ Catat'}</span></button>`).join('')}</div><p class="muted">${count===5?'🌷 Alhamdulillah, lima shalat hari ini telah dicatat!':'Sisa '+(5-count)+' shalat untuk dicatat.'} <button class="info" aria-label="Dalil shalat wajib" onclick="prayerInfo()">ⓘ</button></p></div>`}
function prayerInfo(){showModal(`<h2>🕌 Shalat lima waktu</h2><p>Shalat wajib: Subuh, Dzuhur, Ashar, Maghrib, dan Isya.</p><div class="quote">“Shalat lima waktu ... menghapus dosa-dosa di antaranya selama dosa besar dijauhi.”<br><b>HR. Muslim no. 233 (makna ringkas)</b></div><p class="muted">Counter hanya alat pencatatan pribadi, bukan penilaian atas diterimanya ibadah. Satu catatan per shalat per tanggal.</p><button class="primary" onclick="closeModal()">Tutup</button>`)}
function tabs(){document.getElementById('tabs').innerHTML=[['today','🌷','Hari ini'],['calendar','📅','Kalender'],['rewards','🏆','Reward'],['settings','⚙️','Pengaturan']].map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="page='${id}';render()">${ic}<br>${label}</button>`).join('')}
function header(){return `<header><div class="muted">Assalamu’alaikum,</div><h1>${esc(state.name)}</h1><div>Langkah kecil, istiqamah setiap hari.</div></header>`}
function stats(){return `<div class="stats"><div class="stat"><b>${completed()}</b><span>Selesai</span></div><div class="stat"><b>${pct()}%</b><span>Progress</span></div><div class="stat"><b>${points()} ⭐</b><span>Total poin</span></div></div>`}
function today(){let groups=[...new Set(state.habits.map(h=>h.group))];return header()+stats()+`<div class="card"><div class="row between"><h2>🌱 Ibadah harian</h2><input type="date" aria-label="Pilih tanggal" style="width:150px" value="${selected}" onchange="selected=this.value;render()"></div><div class="progress"><div style="width:${pct()}%"></div></div><p class="muted">${completed()} dari ${state.habits.length} kebiasaan • ${selected}</p></div>`+prayerCard()+groups.map(g=>`<div class="card"><div class="sectiontitle">${esc(g)}</div>${state.habits.filter(h=>h.group===g).map(h=>`<div class="habit"><button aria-label="Centang ${esc(h.name)}" class="check ${checked(h.id)?'done':''}" onclick="toggle('${h.id}')">${checked(h.id)?'✓':''}</button><div class="label"><strong>${esc(h.name)}</strong><small>Target ${h.goal} hari/bulan • +10 ⭐</small></div><button class="info" aria-label="Dalil dan deskripsi" onclick="info('${h.id}')">ⓘ</button></div>`).join('')}</div>`).join('')}
function info(id){let h=state.habits.find(x=>x.id===id);if(!h)return;let [quote,source]=B[h.hadith]||B.intention;let note=h.hadith==='monday'?'Hadis ini khusus mengenai hari Senin. Puasa Kamis juga dicontohkan Nabi ﷺ (HR. Tirmidzi no. 745, dinilai hasan).':h.name.includes('Al-Waqiah')||h.name.includes('Seribu Dinar')||h.name.includes('Nabi Musa')?'Hadis berikut tentang keutamaan umum membaca Al-Qur’an atau niat, bukan klaim keutamaan khusus bacaan ini.':'';showModal(`<h2>🌷 ${esc(h.name)}</h2><p>Target: ${h.goal} hari/bulan. Anda dapat menyesuaikannya di Pengaturan.</p><div class="quote">“${esc(quote)}”<br><b>${esc(source)}</b></div>${note?`<p class="muted">${esc(note)}</p>`:''}<p class="muted">Hadis menjadi pengingat, bukan jaminan pahala tertentu atas checklist.</p><button class="primary" onclick="closeModal()">Tutup</button>`)}
function calendar(){let [y,m]=month.split('-').map(Number),first=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate(),arr=[];for(let i=0;i<first;i++)arr.push('<span></span>');for(let d=1;d<=days;d++){let dt=month+'-'+String(d).padStart(2,'0');arr.push(`<button class="day ${dt===selected?'selected':''} ${dt===localDate()?'today':''}" onclick="selected='${dt}';page='today';render()">${d}<br><small>${pct(dt)}% · 🕌${prayerCount(dt)}/5</small></button>`)}let prev=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let dt=localDate(d);prev.push(`<div><div class="bar"><div style="height:${pct(dt)}%"></div></div><small>${d.toLocaleDateString('id-ID',{weekday:'short'})}<br>${pct(dt)}%</small></div>`)}return header()+`<div class="card"><div class="row between"><button onclick="changeMonth(-1)">‹</button><h2>${new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</h2><button onclick="changeMonth(1)">›</button></div><div class="calendar">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(x=>`<b>${x}</b>`).join('')}${arr.join('')}</div><p class="muted">Pilih tanggal untuk melihat atau mengubah checklist.</p></div><div class="card"><h2>📈 7 hari terakhir</h2><div class="chart">${prev.join('')}</div></div>`}
function changeMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=localDate(d).slice(0,7);render()}
function rewards(){let p=points(),badges=[['🌱','Langkah pertama',10],['🌼','Mulai tumbuh',100],['🌷','Istiqamah',300],['🌻','Rajin berlatih',700],['🏆','Seribu langkah',1000]];return header()+`<div class="card" style="text-align:center"><div style="font-size:48px">🏆</div><h1>${p} poin</h1><p>Level ${level()} • ${200-p%200} poin menuju level berikutnya</p><div class="progress"><div style="width:${p%200/2}%"></div></div><p class="muted">10 poin untuk setiap checklist atau shalat wajib yang dicatat. Poin dapat berkurang jika checklist dibatalkan.</p></div><div class="card"><h2>🎁 Koleksi lencana</h2>${badges.map(([emoji,label,threshold])=>`<div class="habit" style="opacity:${p>=threshold?1:.4}"><div style="font-size:30px">${emoji}</div><div class="label"><strong>${label}</strong><small>${threshold} poin</small></div>${p>=threshold?'✓':'🔒'}</div>`).join('')}</div>`}
function settings(){return header()+`<div class="card"><h2>👤 Profil</h2><label>Nama pengguna</label><input id="newName" maxlength="40" value="${esc(state.name)}"><p><button class="primary" onclick="state.name=document.getElementById('newName').value.trim()||'Sahabat';save();render();toast('Nama tersimpan')">Simpan nama</button></p></div><div class="card"><h2>🌿 Kelola kebiasaan</h2><p class="muted">Ubah nama dan target, tambah atau hapus kebiasaan. Target hanya pengingat pribadi.</p>${state.habits.map(h=>`<div class="habit"><div class="label"><strong>${esc(h.name)}</strong><small>${h.goal} hari/bulan</small></div><button onclick="editHabit('${h.id}')">Edit</button></div>`).join('')}<p><button class="primary" onclick="editHabit()">+ Tambah ibadah</button></p></div><div class="card"><h2>💾 Cadangan data</h2><p class="muted">Data disimpan di perangkat ini, bukan dikirim ke server. Ekspor cadangan sebelum menghapus aplikasi atau data browser.</p><button onclick="exportData()">Unduh JSON</button> <label style="display:inline-block;padding:10px;background:#eff9dc;border-radius:12px;cursor:pointer">Impor JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>`}
function editHabit(id){let h=state.habits.find(x=>x.id===id)||{id:'',name:'',goal:24,group:'Pagi',hadith:'consistent'};showModal(`<h2>${id?'Edit':'Tambah'} kebiasaan</h2><p>Nama</p><input id="hn" maxlength="80" value="${esc(h.name)}"><p>Target hari per bulan (1–31)</p><input id="hg" type="number" min="1" max="31" value="${h.goal}"><p>Waktu</p><select id="ht">${['Pagi','Siang','Petang','Malam','Pekan'].map(x=>`<option ${x===h.group?'selected':''}>${x}</option>`).join('')}</select><p>Dalil umum yang relevan</p><select id="hh">${Object.keys(B).map(k=>`<option value="${k}" ${k===h.hadith?'selected':''}>${{consistent:'Konsistensi',quran:'Membaca Al-Qur’an',night:'Tahajud',charity:'Sedekah',dhikr:'Dzikir setelah salat',monday:'Puasa Senin',intention:'Niat'}[k]}</option>`).join('')}</select><p><button class="primary" onclick="saveHabit('${id}')">Simpan</button> <button onclick="closeModal()">Batal</button> ${id?`<button onclick="deleteHabit('${id}')">Hapus</button>`:''}</p>`)}
function saveHabit(id){let name=document.getElementById('hn').value.trim(),goal=Number(document.getElementById('hg').value);if(!name||goal<1||goal>31||!Number.isInteger(goal))return alert('Isi nama dan target 1–31');let h={id:id||'custom'+Date.now(),name,goal,group:document.getElementById('ht').value,hadith:document.getElementById('hh').value};if(id){let i=state.habits.findIndex(x=>x.id===id);state.habits[i]=h}else state.habits.push(h);save();closeModal();render()}
function deleteHabit(id){if(!confirm('Hapus kebiasaan ini? Riwayat checklist untuk kebiasaan ini tidak dihitung lagi.'))return;state.habits=state.habits.filter(h=>h.id!==id);for(let date of Object.keys(state.logs))state.logs[date]=state.logs[date].filter(x=>x!==id);save();closeModal();render()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ibadahku-cadangan-'+localDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(input){let f=input.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!Array.isArray(s.habits)||typeof s.logs!=='object'||!s.logs||typeof s.name!=='string'||(s.prayers!==undefined&&(typeof s.prayers!=='object'||!s.prayers)))throw Error('Format tidak valid');if(!confirm('Ganti seluruh data dengan file cadangan?'))return;state=s;state.prayers??={};save();render();toast('Cadangan dipulihkan')}catch(e){alert('Gagal membaca cadangan: '+e.message)}}
function welcome(){document.getElementById('tabs').innerHTML='';root.innerHTML=`<header style="margin-top:12vh;text-align:center;padding:42px 20px"><div style="font-size:55px">🌷</div><h1>Selamat datang di Ibadahku</h1><p>Catat ibadah, tumbuhkan kebiasaan baik, dan rayakan setiap langkah kecil.</p></header><div class="card"><h2>Siapa nama Anda?</h2><input id="welcomeName" maxlength="40" placeholder="Masukkan nama panggilan" autofocus><p><button class="primary" style="width:100%" onclick="state.name=document.getElementById('welcomeName').value.trim();if(!state.name)return alert('Masukkan nama terlebih dahulu');save();render()">Mulai perjalanan 🌱</button></p><p class="muted">Catatan hanya tersimpan di perangkat Anda.</p></div>`}
function render(){if(!state.name){welcome();return}tabs();root.innerHTML=({today,calendar,rewards,settings}[page]||today)()};if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
